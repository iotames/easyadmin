name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 校验格式
        run: |
          files=$(gofmt -l cmd kernel infra internal webui)
          if [ -n "$files" ]; then
            echo "以下文件未格式化，请运行 make fmt："
            echo "$files"
            exit 1
          fi

      - name: 构建
        run: go build ./...

      - name: 静态检查
        run: go vet ./...

      - name: 测试
        run: go test ./...

      - name: 并发检查
        run: go test -race ./...